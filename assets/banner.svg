<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:700 64px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#e5e7eb;}
      .subtitle{font:400 22px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#9ca3af;}
      .chip{font:600 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#cbd5e1;}
      .mono{font:600 18px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#cbd5e1;}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.18">
    <path d="M0 70H1600" stroke="#94a3b8" stroke-width="1"/>
    <path d="M0 140H1600" stroke="#94a3b8" stroke-width="1"/>
    <path d="M0 210H1600" stroke="#94a3b8" stroke-width="1"/>
    <path d="M0 280H1600" stroke="#94a3b8" stroke-width="1"/>
    <path d="M0 350H1600" stroke="#94a3b8" stroke-width="1"/>
    <path d="M140 0V420" stroke="#94a3b8" stroke-width="1"/>
    <path d="M320 0V420" stroke="#94a3b8" stroke-width="1"/>
    <path d="M500 0V420" stroke="#94a3b8" stroke-width="1"/>
    <path d="M680 0V420" stroke="#94a3b8" stroke-width="1"/>
    <path d="M860 0V420" stroke="#94a3b8" stroke-width="1"/>
    <path d="M1040 0V420" stroke="#94a3b8" stroke-width="1"/>
    <path d="M1220 0V420" stroke="#94a3b8" stroke-width="1"/>
    <path d="M1400 0V420" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Accent bar -->
  <rect x="90" y="86" width="10" height="250" rx="5" fill="url(#accent)"/>

  <!-- Shield icon -->
  <g transform="translate(125 110)" filter="url(#shadow)">
    <path d="M120 12c-34 22-72 30-108 32v86c0 72 44 116 108 146c64-30 108-74 108-146V44c-36-2-74-10-108-32Z" fill="#0b2a2a" stroke="#22c55e" stroke-width="3"/>
    <path d="M120 58c-20 14-44 20-72 22v52c0 44 26 72 72 94c46-22 72-50 72-94V80c-28-2-52-8-72-22Z" fill="#0f172a" opacity="0.9"/>
    <path d="M86 138l22 22l50-58" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="430" y="165" class="title">PhishGuard</text>
  <rect x="430" y="190" width="260" height="6" rx="3" fill="url(#accent)" opacity="0.95"/>
  <text x="430" y="235" class="subtitle">Phishing URL Detection • React + Node/Express + FastAPI ML</text>
  <text x="430" y="270" class="subtitle">Classifies URLs as SAFE or PHISHING with an ML microservice.</text>

  <!-- Chips -->
  <g transform="translate(430 305)">
    <rect x="0" y="0" width="150" height="42" rx="21" fill="#111827" stroke="#1f2937"/>
    <text x="22" y="27" class="chip">React</text>

    <rect x="168" y="0" width="190" height="42" rx="21" fill="#111827" stroke="#1f2937"/>
    <text x="190" y="27" class="chip">Node/Express</text>

    <rect x="376" y="0" width="170" height="42" rx="21" fill="#111827" stroke="#1f2937"/>
    <text x="398" y="27" class="chip">FastAPI</text>

    <rect x="564" y="0" width="240" height="42" rx="21" fill="#111827" stroke="#1f2937"/>
    <text x="586" y="27" class="mono">ML_SERVICE_URL</text>
  </g>

  <!-- Right-side minimal figure -->
  <g transform="translate(1040 88)" opacity="0.95">
    <rect x="0" y="0" width="470" height="250" rx="18" fill="#0b1020" stroke="#1f2937"/>
    <text x="26" y="46" class="mono" fill="#e5e7eb">$ curl /classify?url=…</text>
    <rect x="26" y="70" width="418" height="1" fill="#1f2937"/>

    <rect x="26" y="95" width="418" height="44" rx="12" fill="#0f172a" stroke="#1f2937"/>
    <circle cx="54" cy="117" r="8" fill="#22c55e"/>
    <text x="74" y="123" class="chip">SAFE</text>
    <text x="310" y="123" class="mono" fill="#9ca3af">score: 0.06</text>

    <rect x="26" y="150" width="418" height="44" rx="12" fill="#0f172a" stroke="#1f2937"/>
    <circle cx="54" cy="172" r="8" fill="#ef4444"/>
    <text x="74" y="178" class="chip">PHISHING</text>
    <text x="298" y="178" class="mono" fill="#9ca3af">score: 0.93</text>

    <rect x="26" y="205" width="418" height="20" rx="10" fill="#111827"/>
    <rect x="26" y="205" width="310" height="20" rx="10" fill="url(#accent)" opacity="0.85"/>
  </g>
</svg>
