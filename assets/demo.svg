<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .bg{fill:#0b1220;}
      .panel{fill:#0f172a;stroke:#1f2937;stroke-width:2;}
      .title{font:700 30px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#e5e7eb;}
      .h{font:700 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#e5e7eb;}
      .t{font:500 16px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#cbd5e1;}
      .mono{font:600 15px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#cbd5e1;}
      .muted{fill:#94a3b8;font:500 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;}
      .chip{fill:#111827;stroke:#1f2937;stroke-width:2;}
      .ok{fill:#22c55e;}
      .bad{fill:#ef4444;}
      .barbg{fill:#111827;}
      .accent{fill:#38bdf8;}
      .accent2{fill:#22c55e;}
    </style>
  </defs>

  <rect class="bg" width="1200" height="620" rx="22"/>

  <text x="60" y="70" class="title">Demo: URL Classification</text>
  <text x="60" y="102" class="muted">Enter a URL → run ML inference → show label + confidence</text>

  <!-- Left: Input -->
  <rect x="70" y="145" width="520" height="420" rx="18" class="panel"/>
  <text x="100" y="190" class="h">Try it</text>
  <text x="100" y="218" class="muted">Paste a URL to check for phishing</text>

  <rect x="100" y="250" width="460" height="56" rx="14" class="chip"/>
  <text x="122" y="285" class="mono">https://login-verify.example.com/reset</text>

  <rect x="100" y="330" width="210" height="48" rx="14" fill="#0b2a2a" stroke="#22c55e" stroke-width="2"/>
  <text x="132" y="360" class="mono" fill="#e5e7eb">Classify URL</text>

  <rect x="330" y="330" width="230" height="48" rx="14" fill="#0b1f33" stroke="#38bdf8" stroke-width="2"/>
  <text x="360" y="360" class="mono" fill="#e5e7eb">View API payload</text>

  <!-- mini payload -->
  <rect x="100" y="408" width="460" height="130" rx="14" class="chip"/>
  <text x="122" y="440" class="mono">POST /api/classify</text>
  <text x="122" y="468" class="mono" fill="#9ca3af">{ "url": "https://…" }</text>
  <text x="122" y="496" class="mono" fill="#9ca3af">→ { "label": "PHISHING", "score": 0.93 }</text>

  <!-- Right: Result card -->
  <rect x="650" y="145" width="480" height="420" rx="18" class="panel"/>
  <text x="680" y="190" class="h">Result</text>
  <text x="680" y="218" class="muted">Model prediction</text>

  <rect x="680" y="250" width="420" height="86" rx="16" class="chip"/>
  <circle cx="718" cy="293" r="10" class="bad"/>
  <text x="744" y="299" class="h">PHISHING</text>
  <text x="900" y="299" class="mono" fill="#9ca3af">score: 0.93</text>

  <text x="680" y="372" class="muted">Confidence</text>
  <rect x="680" y="390" width="420" height="18" rx="9" class="barbg"/>
  <rect x="680" y="390" width="390" height="18" rx="9" class="accent" opacity="0.85"/>

  <text x="680" y="448" class="muted">Why the model flagged it</text>
  <rect x="680" y="468" width="420" height="78" rx="14" class="chip"/>
  <text x="702" y="502" class="t">• suspicious tokens (login / verify)</text>
  <text x="702" y="530" class="t">• domain mismatch / uncommon TLD</text>

  <!-- Footer -->
  <text x="60" y="600" class="muted">Minimal mock UI (SVG) • replace later with real screenshots if you want</text>
</svg>
